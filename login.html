<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Ôn Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="wordmark" translate="no">Ôn<span>Anh</span></a>
    <h1>Đăng nhập</h1>
    <p class="auth-subtext">Dùng email và mật khẩu đã được cấp cho bạn.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Đăng nhập</button>
    </form>
  </div>
</main>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
